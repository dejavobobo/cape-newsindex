[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CAPEnewsindex"
version = "1.0.0"
description = "Build news-based uncertainty indices (EPU, TPU, or any index you define) from newspaper archives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shakir Adeyemi Tewogbade" }]
keywords = ["economic policy uncertainty", "epu", "uncertainty index", "news analytics", "text analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pandas>=1.5", "numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]
plotly = ["plotly>=5"]
seaborn = ["seaborn>=0.13"]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]
gsheet = ["gspread>=6"]
docx = ["python-docx>=1.1"]
pdf = ["fpdf2>=2.7"]

[project.urls]
Homepage = "https://github.com/CAPE-ERC/cape-newsindex"
Issues = "https://github.com/CAPE-ERC/cape-newsindex/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
CAPEnewsindex = ["data/*.csv", "data/*.json", "data/logo.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
